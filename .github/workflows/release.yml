name: 앱 릴리스 배포

# v1.2.0 처럼 v로 시작하는 태그를 푸시하면 자동으로 빌드·서명·릴리스한다.
# Actions 탭에서 수동 실행(workflow_dispatch)하면 pubspec 버전으로 태그를 만든다.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/flutter_app

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 태그와 pubspec 버전이 어긋나면 앱의 업데이트 확인이 깨지므로 먼저 막는다.
      - name: 버전 확인
        id: ver
        run: |
          PUBSPEC=$(grep -m1 '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*//' | cut -d'+' -f1 | tr -d '[:space:]')
          if [ -z "$PUBSPEC" ]; then
            echo "::error::pubspec.yaml 에서 version 을 읽지 못했습니다."
            exit 1
          fi
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
            if [ "${TAG#v}" != "$PUBSPEC" ]; then
              echo "::error::태그($TAG)와 pubspec 버전($PUBSPEC)이 다릅니다. pubspec.yaml 의 version 을 맞춘 뒤 태그를 다시 만드세요."
              exit 1
            fi
          else
            TAG="v$PUBSPEC"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "배포 버전: $TAG" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.2
          channel: stable
          cache: true

      # 릴리스 키스토어를 Secrets 에서 복원. 없으면 디버그 키로 서명돼
      # 기존 앱을 덮어쓰지 못하므로 아예 실패시킨다.
      - name: 서명 키 복원
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 시크릿이 없습니다. README 의 '자동 배포' 절을 참고해 4개 시크릿을 등록하세요."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          printf 'storeFile=upload-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties

      - name: 의존성 설치
        run: flutter pub get

      - name: 정적 분석
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: APK 빌드
        run: flutter build apk --release

      # 서명 지문을 남겨 두면 버전 간 서명이 바뀌었는지 바로 확인할 수 있다.
      - name: APK 준비 및 서명 지문 기록
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk AquaControl.apk
          SIZE=$(du -h AquaControl.apk | cut -f1)
          FP=$(keytool -printcert -jarfile AquaControl.apk | grep -m1 'SHA256:' | sed 's/^[[:space:]]*//')
          {
            echo "- APK 크기: $SIZE"
            echo "- 서명 $FP"
            echo ""
            echo "> 이 지문이 이전 릴리스와 같아야 기존 앱 위에 업데이트가 설치됩니다."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 릴리스 생성 및 APK 첨부
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "기존 릴리스 $TAG 에 APK 를 덮어씁니다."
            gh release upload "$TAG" AquaControl.apk --clobber
          else
            gh release create "$TAG" AquaControl.apk \
              --title "$TAG" \
              --generate-notes
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "릴리스: ${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
