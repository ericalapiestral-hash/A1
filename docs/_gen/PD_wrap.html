<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;padding:0;background:#fff}svg{display:block}</style></head><body><svg width="1400" height="1080" viewBox="0 0 1400 1080" xmlns="http://www.w3.org/2000/svg" font-family="'Malgun Gothic','Segoe UI',system-ui,sans-serif">
<rect x="0" y="0" width="1400" height="1080" fill="#ffffff"/><text x="40" y="42" font-size="22" fill="#111827" text-anchor="start" font-weight="700">12V 펌프 플라이백 다이오드 연결법 — 1N4007 한 개 · 납땜 없이 단자대로</text><text x="40" y="68" font-size="13.5" fill="#6b7280" text-anchor="start" font-weight="400">펌프 양단(+ / −)에 다이오드를 "거꾸로(역방향)" 병렬로 · 띠(흰색)가 펌프 (+) 쪽 · 단자대(스크류 터미널)에 같이 꽂으면 끝</text><text x="40" y="102" font-size="14" fill="#0f4c81" text-anchor="start" font-weight="700">① 왜 다는가 — 릴레이가 끊기는 순간 역방향 스파이크 발생</text><rect x="40" y="110" width="680" height="180" rx="10" fill="#fff8e6" stroke="#e0b94a"/><rect x="58" y="144" width="120" height="110" rx="60" fill="#fff" stroke="#111827"/><text x="118" y="176" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">펌프 모터</text><text x="118" y="194" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">(코일/인덕터)</text><text x="118" y="228" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">12V DC</text><text x="200" y="152" font-size="12.5" fill="#111827" text-anchor="start" font-weight="400">· 모터 코일에 전류가 흐르다 갑자기 끊기면 ⚡</text><text x="200" y="172" font-size="12.5" fill="#111827" text-anchor="start" font-weight="400">· 코일이 남은 에너지를 반대 방향으로 강하게 토해냄</text><text x="200" y="192" font-size="12.5" fill="#b0291f" text-anchor="start" font-weight="400">· 수십~수백 V 스파이크 → 릴레이 접점 태움/노이즈</text><text x="200" y="218" font-size="12.5" fill="#111827" text-anchor="start" font-weight="400">· 다이오드가 그 스파이크를 코일로 되돌려 안전하게 소모</text><text x="200" y="238" font-size="12.5" fill="#1f6b43" text-anchor="start" font-weight="600">· 한 번 달면 릴레이 수명↑ ESP32 리셋·튐↓</text><text x="200" y="264" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="400">· 부품 1개로 끝 (1N4007 · 100원 안팎)</text><text x="40" y="312" font-size="14" fill="#0f4c81" text-anchor="start" font-weight="700">② 회로도 — 다이오드는 펌프 양단에 "거꾸로" 병렬</text><rect x="40" y="320" width="680" height="440" rx="10" fill="#fff" stroke="#cbd5e1"/><rect x="70" y="360" width="110" height="56" rx="6" fill="#f6f8fa" stroke="#111827"/><text x="125" y="384" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">12V 어댑터</text><circle cx="92" cy="416" r="4" fill="#d4453b"/><text x="92" y="432" font-size="10.5" fill="#d4453b" text-anchor="middle" font-weight="700">+12V</text><circle cx="158" cy="416" r="4" fill="#1f2937"/><text x="158" y="432" font-size="10.5" fill="#1f2937" text-anchor="middle" font-weight="700">GND</text><rect x="300" y="360" width="150" height="56" rx="6" fill="#eaf3ff" stroke="#0f4c81"/><text x="375" y="384" font-size="12" fill="#0f4c81" text-anchor="middle" font-weight="700">릴레이 접점</text><text x="375" y="402" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">(ESP32 ON/OFF)</text><circle cx="300" cy="388" r="4" fill="#d4453b"/><text x="294" y="392" font-size="10.5" fill="#d4453b" text-anchor="end" font-weight="700">COM</text><circle cx="450" cy="388" r="4" fill="#d4453b"/><text x="456" y="392" font-size="10.5" fill="#d4453b" text-anchor="start" font-weight="700">NO</text><rect x="300" y="490" width="180" height="120" rx="50" fill="#fff" stroke="#111827" stroke-width="1.5"/><text x="390" y="542" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">12V 펌프</text><text x="390" y="562" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">(모터)</text><circle cx="300" cy="524" r="4" fill="#d4453b"/><text x="294" y="528" font-size="13" fill="#d4453b" text-anchor="end" font-weight="700">(+)</text><circle cx="300" cy="576" r="4" fill="#1f2937"/><text x="294" y="580" font-size="13" fill="#1f2937" text-anchor="end" font-weight="700">(−)</text><polyline points="92,416 92,470 270,470 270,388 300,388" fill="none" stroke="#d4453b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><polyline points="450,388 480,388 480,494 270,494 270,524 300,524" fill="none" stroke="#d4453b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><polyline points="300,576 158,576 158,416" fill="none" stroke="#1f2937" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><polyline points="480,524 560,524 560,524" fill="none" stroke="#d4453b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><polyline points="480,576 560,576 560,576" fill="none" stroke="#1f2937" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><polygon points="546,572 574,572 560,534" fill="#111827"/><line x1="544" y1="534" x2="576" y2="534" stroke="#111827" stroke-width="3.5"/><text x="582" y="522" font-size="11.5" fill="#d4453b" text-anchor="start" font-weight="700">K (캐소드) = 흰 띠</text><text x="582" y="540" font-size="11" fill="#d4453b" text-anchor="start" font-weight="400">→ 펌프 (+) 쪽</text><text x="582" y="580" font-size="11.5" fill="#1f2937" text-anchor="start" font-weight="700">A (애노드)</text><text x="582" y="598" font-size="11" fill="#1f2937" text-anchor="start" font-weight="400">→ 펌프 (−) 쪽</text><text x="560" y="502" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">1N4007</text><rect x="60" y="656" width="640" height="86" rx="8" fill="#eef7f0" stroke="#1f6b43"/><text x="74" y="680" font-size="13" fill="#1f6b43" text-anchor="start" font-weight="700">동작</text><text x="74" y="702" font-size="12" fill="#111827" text-anchor="start" font-weight="400">· 평상시(릴레이 ON, 전류 흐름 中): 다이오드는 역방향 → 차단 (전류 X)</text><text x="74" y="720" font-size="12" fill="#111827" text-anchor="start" font-weight="400">· 릴레이 OFF 순간: 코일이 만든 역스파이크가 순방향 → 다이오드로 빠져 안전히 소모</text><text x="74" y="738" font-size="12" fill="#b0291f" text-anchor="start" font-weight="400">· 다이오드가 없으면 그 스파이크가 릴레이 접점을 태움(아크) + ESP32까지 노이즈 유입</text><text x="740" y="102" font-size="14" fill="#0f4c81" text-anchor="start" font-weight="700">③ 1N4007 실제 모양 — 흰 띠가 K(캐소드), 그게 펌프 (+) 쪽</text><rect x="740" y="110" width="620" height="320" rx="10" fill="#fff" stroke="#cbd5e1"/><line x1="880" y1="260" x2="980" y2="260" stroke="#9ca3af" stroke-width="3"/><line x1="1120" y1="260" x2="1220" y2="260" stroke="#9ca3af" stroke-width="3"/><rect x="980" y="234" width="140" height="52" rx="6" fill="#1f1f1f"/><rect x="1088" y="234" width="16" height="52" fill="#ffffff"/><text x="1040" y="265" font-size="14" fill="#fff" text-anchor="middle" font-weight="700">1N4007</text><path d="M 1096 208 L 1096 228" stroke="#d4453b" stroke-width="2.5"/><polygon points="1092,226 1100,226 1096,234" fill="#d4453b"/><text x="1096" y="202" font-size="11.5" fill="#d4453b" text-anchor="middle" font-weight="700">이 띠가 +쪽</text><text x="880" y="290" font-size="13" fill="#1f2937" text-anchor="start" font-weight="700">A (애노드)</text><text x="880" y="310" font-size="12" fill="#1f2937" text-anchor="start" font-weight="400">→ 펌프 (−)에</text><text x="1220" y="290" font-size="13" fill="#d4453b" text-anchor="end" font-weight="700">K (캐소드)</text><text x="1220" y="310" font-size="12" fill="#d4453b" text-anchor="end" font-weight="400">→ 펌프 (+)에</text><text x="764" y="352" font-size="12.5" fill="#111827" text-anchor="start" font-weight="400">· 1N4007 = 1A · 1000V — 12V 펌프엔 충분</text><text x="764" y="372" font-size="12.5" fill="#111827" text-anchor="start" font-weight="400">· 펌프 소비전류 1A 초과 시 1N5408(3A) 또는 SR360(쇼트키)</text><text x="764" y="392" font-size="12.5" fill="#6b7280" text-anchor="start" font-weight="400">· 검정 원통, 다리 2개. 띠 위치만 보면 방향을 알 수 있음</text><text x="764" y="414" font-size="12.5" fill="#b0291f" text-anchor="start" font-weight="600">⚠ 거꾸로 꽂으면 평상시에도 단락 → 다이오드 즉사 / 릴레이 손상</text><text x="740" y="452" font-size="14" fill="#0f4c81" text-anchor="start" font-weight="700">④ 납땜 없이 연결 — 단자대(스크류 터미널)에 같이 꽂기</text><rect x="740" y="460" width="620" height="300" rx="10" fill="#fff" stroke="#cbd5e1"/><rect x="910" y="510" width="220" height="90" rx="6" fill="#1a73a8" stroke="#0f4c81" stroke-width="1.5"/><text x="1020" y="528" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">2P 스크류 단자대 (KF301-2P 등)</text><circle cx="970" cy="560" r="14" fill="#0b0b0b"/><circle cx="1070" cy="560" r="14" fill="#0b0b0b"/><circle cx="970" cy="536" r="8" fill="#d4d4d4" stroke="#666"/><line x1="965" y1="536" x2="975" y2="536" stroke="#333" stroke-width="2"/><circle cx="1070" cy="536" r="8" fill="#d4d4d4" stroke="#666"/><line x1="1065" y1="536" x2="1075" y2="536" stroke="#333" stroke-width="2"/><text x="970" y="618" font-size="12" fill="#d4453b" text-anchor="middle" font-weight="700">(+) 단자</text><text x="1070" y="618" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="700">(−) 단자</text><rect x="760" y="522" width="100" height="80" rx="40" fill="#cbd5e1" stroke="#111827"/><text x="810" y="562" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">12V 펌프</text><polyline points="860,542 970,542 970,546" fill="none" stroke="#d4453b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><polyline points="860,582 1070,582 1070,546" fill="none" stroke="#1f2937" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="868" y="536" font-size="10.5" fill="#d4453b" text-anchor="start" font-weight="700">빨강(+)</text><text x="868" y="598" font-size="10.5" fill="#1f2937" text-anchor="start" font-weight="700">검정(−)</text><polyline points="970,546 970,680" fill="none" stroke="#d4453b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><polyline points="1070,546 1070,680" fill="none" stroke="#1f2937" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="970" y="700" font-size="11" fill="#d4453b" text-anchor="middle" font-weight="700">→ 릴레이 NO</text><text x="1070" y="700" font-size="11" fill="#1f2937" text-anchor="middle" font-weight="700">→ 12V GND</text><line x1="970" y1="638" x2="970" y2="560" stroke="#9ca3af" stroke-width="2.5"/><line x1="1070" y1="638" x2="1070" y2="560" stroke="#9ca3af" stroke-width="2.5"/><line x1="970" y1="630" x2="988" y2="630" stroke="#9ca3af" stroke-width="2.5"/><line x1="1052" y1="630" x2="1070" y2="630" stroke="#9ca3af" stroke-width="2.5"/><rect x="988" y="620" width="64" height="20" rx="3" fill="#1f1f1f"/><rect x="988" y="620" width="8" height="20" fill="#ffffff"/><text x="1020" y="635" font-size="10.5" fill="#fff" text-anchor="middle" font-weight="700">1N4007</text><text x="992" y="612" font-size="11" fill="#d4453b" text-anchor="start" font-weight="700">↑ 띠 (K) → (+) 단자</text><text x="762" y="692" font-size="12.5" fill="#111827" text-anchor="start" font-weight="400">· 펌프 빨강선 + 다이오드 띠 쪽 다리 → 같은 (+) 단자 구멍에 같이 꽂고 스크류 조임</text><text x="762" y="712" font-size="12.5" fill="#111827" text-anchor="start" font-weight="400">· 펌프 검정선 + 다이오드 반대 쪽 다리 → 같은 (−) 단자 구멍에 같이 꽂고 조임</text><text x="762" y="732" font-size="12.5" fill="#111827" text-anchor="start" font-weight="400">· 같은 단자에 릴레이 NO 선과 12V GND 선도 함께 들어옴 (한 구멍에 2~3가닥 OK)</text><text x="762" y="750" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="400">대안: Wago 레버 커넥터 / 무납땜 일자 단자(돼지꼬리) 도 동일한 원리로 사용 가능</text><text x="40" y="792" font-size="14" fill="#0f4c81" text-anchor="start" font-weight="700">⑤ 방향 확인 — 좋은 예 / 나쁜 예</text><rect x="40" y="800" width="650" height="210" rx="10" fill="#eef7f0" stroke="#1f6b43"/><text x="58" y="828" font-size="14" fill="#1f6b43" text-anchor="start" font-weight="700">✅ 좋은 예 — 띠(K)가 펌프 (+) 쪽</text><rect x="90" y="884" width="90" height="52" rx="26" fill="#fff" stroke="#111827"/><text x="135" y="914" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">펌프</text><circle cx="180" cy="898" r="3.5" fill="#d4453b"/><text x="188" y="901" font-size="13" fill="#d4453b" text-anchor="start" font-weight="700">+</text><circle cx="180" cy="926" r="3.5" fill="#1f2937"/><text x="188" y="930" font-size="13" fill="#1f2937" text-anchor="start" font-weight="700">−</text><line x1="250" y1="898" x2="288" y2="898" stroke="#d4453b" stroke-width="2.5"/><line x1="250" y1="926" x2="288" y2="926" stroke="#1f2937" stroke-width="2.5"/><line x1="288" y1="898" x2="288" y2="926" stroke="#d4453b" stroke-width="2.5"/><line x1="332" y1="898" x2="332" y2="926" stroke="#1f2937" stroke-width="2.5"/><rect x="288" y="902" width="44" height="22" rx="3" fill="#1f1f1f"/><rect x="288" y="902" width="8" height="22" fill="#fff"/><text x="292" y="892" font-size="11" fill="#d4453b" text-anchor="start" font-weight="700">↑ 띠</text><text x="58" y="975" font-size="12.5" fill="#1f6b43" text-anchor="start" font-weight="600">평상시: 차단 · 끊는 순간: 흡수 → 정상 동작</text><rect x="710" y="800" width="650" height="210" rx="10" fill="#fff5f4" stroke="#b0291f"/><text x="728" y="828" font-size="14" fill="#b0291f" text-anchor="start" font-weight="700">❌ 나쁜 예 — 띠가 (−) 쪽으로 거꾸로</text><rect x="760" y="884" width="90" height="52" rx="26" fill="#fff" stroke="#111827"/><text x="805" y="914" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">펌프</text><circle cx="850" cy="898" r="3.5" fill="#d4453b"/><text x="858" y="901" font-size="13" fill="#d4453b" text-anchor="start" font-weight="700">+</text><circle cx="850" cy="926" r="3.5" fill="#1f2937"/><text x="858" y="930" font-size="13" fill="#1f2937" text-anchor="start" font-weight="700">−</text><line x1="920" y1="898" x2="958" y2="898" stroke="#d4453b" stroke-width="2.5"/><line x1="920" y1="926" x2="958" y2="926" stroke="#1f2937" stroke-width="2.5"/><line x1="958" y1="898" x2="958" y2="926" stroke="#d4453b" stroke-width="2.5"/><line x1="1002" y1="898" x2="1002" y2="926" stroke="#1f2937" stroke-width="2.5"/><rect x="958" y="902" width="44" height="22" rx="3" fill="#1f1f1f"/><rect x="994" y="902" width="8" height="22" fill="#fff"/><text x="998" y="892" font-size="11" fill="#b0291f" text-anchor="end" font-weight="700">↑ 띠(거꾸로)</text><text x="1070" y="915" font-size="28" fill="#111827" text-anchor="middle" font-weight="400">💥</text><text x="728" y="950" font-size="12.5" fill="#b0291f" text-anchor="start" font-weight="600">평상시에도 단락 → 다이오드 즉사 · 릴레이/어댑터 손상 가능</text><text x="728" y="975" font-size="12.5" fill="#b0291f" text-anchor="start" font-weight="400">연기·열·과전류 발생 → 즉시 전원 차단하고 방향 확인</text><text x="700" y="1054" font-size="13.5" fill="#0f4c81" text-anchor="middle" font-weight="700">핵심: 1N4007 한 개 · 띠(흰색 K)가 펌프 (+) 쪽 · 펌프 두 선과 함께 단자대 (+)/(−) 구멍에 같이 꽂으면 끝</text>
</svg>
</body></html>
