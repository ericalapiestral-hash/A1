470" cy="288" r="5" fill="#4b5563"/><text x="484" y="292" font-size="12.5" fill="#111827" text-anchor="start" font-weight="400">GND  (공통)</text><circle cx="470" cy="334" r="5" fill="#2f6fb0"/><text x="484" y="338" font-size="12.5" fill="#111827" text-anchor="start" font-weight="400">IN1  (펌프1)</text><circle cx="470" cy="380" r="5" fill="#2f6fb0"/><text x="484" y="384" font-size="12.5" fill="#111827" text-anchor="start" font-weight="400">IN2  (펌프2)</text><circle cx="470" cy="426" r="5" fill="#2f6fb0"/><text x="484" y="430" font-size="12.5" fill="#111827" text-anchor="start" font-weight="400">IN3  (히터)</text><polyline points="220,242 440,242 440,242 470,242" fill="none" stroke="#d4453b" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/><polyline points="220,288 430,288 430,288 470,288" fill="none" stroke="#4b5563" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/><polyline points="220,334 470,334" fill="none" stroke="#2f6fb0" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/><polyline points="220,380 470,380" fill="none" stroke="#2f6fb0" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/><polyline points="220,426 470,426" fill="none" stroke="#2f6fb0" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/><line x1="400" y1="238" x2="400" y2="249" stroke="#7c3aed" stroke-width="2.4"/><line x1="388" y1="249" x2="412" y2="249" stroke="#7c3aed" stroke-width="2.8"/><path d="M 391 257 q 9 6 18 0" fill="none" stroke="#7c3aed" stroke-width="2.4"/><line x1="400" y1="260" x2="400" y2="268" stroke="#7c3aed" stroke-width="2.4"/><text x="418" y="258" font-size="11" fill="#7c3aed" text-anchor="start" font-weight="600">10µF+0.1µF</text><polyline points="400,242 400,238" fill="none" stroke="#d4453b" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><polyline points="400,268 400,288" fill="none" stroke="#4b5563" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><text x="350" y="230" font-size="10.5" fill="#7c3aed" text-anchor="start" font-weight="400">디커플링</text><circle cx="770" cy="410" r="5" fill="#1f6b43"/><text x="756" y="414" font-size="12" fill="#111827" text-anchor="end" font-weight="400">CH1 COM/NO</text><circle cx="770" cy="456" r="5" fill="#1f6b43"/><text x="756" y="460" font-size="12" fill="#111827" text-anchor="end" font-weight="400">CH2 COM/NO</text><circle cx="770" cy="502" r="5" fill="#b0291f"/><text x="756" y="506" font-size="12" fill="#111827" text-anchor="end" font-weight="400">CH3 COM/NO</text><rect x="860" y="150" width="200" height="116" rx="10" fill="#fff" stroke="#1f6b43" stroke-width="1.5"/><text x="960" y="178" font-size="14" fill="#1f6b43" text-anchor="middle" font-weight="700">펌프1 (급수)</text><text x="960" y="198" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="400">SZH-PWAT-040 · 12V DC</text><text x="960" y="222" font-size="11" fill="#111827" text-anchor="middle" font-weight="400">12V+ → COM1</text><text x="960" y="240" font-size="11" fill="#111827" text-anchor="middle" font-weight="400">NO1 → 펌프1(+)</text><text x="960" y="258" font-size="11" fill="#111827" text-anchor="middle" font-weight="400">12V− → 펌프1(−)</text><rect x="860" y="290" width="200" height="116" rx="10" fill="#fff" stroke="#1f6b43" stroke-width="1.5"/><text x="960" y="318" font-size="14" fill="#1f6b43" text-anchor="middle" font-weight="700">펌프2 (순환)</text><text x="960" y="338" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="400">SZH-PWAT-040 · 12V DC</text><text x="960" y="362" font-size="11" fill="#111827" text-anchor="middle" font-weight="400">12V+ → COM2</text><text x="960" y="380" font-size="11" fill="#111827" text-anchor="middle" font-weight="400">NO2 → 펌프2(+)</text><text x="960" y="398" font-size="11" fill="#111827" text-anchor="middle" font-weight="400">12V− → 펌프2(−)</text><rect x="860" y="430" width="200" height="130" rx="10" fill="#fff" stroke="#b0291f" stroke-width="1.5"/><text x="960" y="458" font-size="14" fill="#b0291f" text-anchor="middle" font-weight="700">히터 (220V)</text><text x="960" y="478" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="400">HE-50W · 220V AC</text><text x="960" y="502" font-size="11" fill="#111827" text-anchor="middle" font-weight="400">220V L → COM3</text><text x="960" y="520" font-size="11" fill="#111827" text-anchor="middle" font-weight="400">NO3 → 히터 L</text><text x="960" y="538" font-size="11" fill="#111827" text-anchor="middle" font-weight="400">220V N → 히터 N</text><polyline points="770,410 830,410 830,205 860,205" fill="none" stroke="#1f6b43" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/><polyline points="770,456 814,456 814,345 860,345" fill="none" stroke="#1f6b43" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/><polyline points="770,502 798,502 798,490 860,490" fill="none" stroke="#b0291f" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/><rect x="1090" y="150" width="290" height="116" rx="10" fill="#fff" stroke="#111827" stroke-width="1.5"/><text x="1235" y="178" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">12V 어댑터</text><text x="1235" y="198" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="400">펌프1·펌프2 공급</text><text x="1235" y="222" font-size="11" fill="#111827" text-anchor="middle" font-weight="400">두 펌프 공용 시 전류 용량 확인</text><text x="1235" y="240" font-size="11" fill="#111827" text-anchor="middle" font-weight="400">12V와 220V 배선 물리적 분리</text><rect x="1090" y="430" width="290" height="130" rx="10" fill="#fff" stroke="#b0291f" stroke-width="1.5"/><text x="1235" y="458" font-size="14" fill="#b0291f" text-anchor="middle" font-weight="700">⚠ 220V 콘센트</text><text x="1235" y="478" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="400">반드시 전원 뽑고 작업</text><text x="1235" y="502" font-size="11" fill="#111827" text-anchor="middle" font-weight="400">L/N 단자 절연·노출 금지</text><text x="1235" y="520" font-size="11" fill="#111827" text-anchor="middle" font-weight="400">릴레이는 정격 2~3배 여유품</text><rect x="40" y="582" width="1340" height="38" rx="8" fill="#eef7f0" stroke="#79b894"/><text x="56" y="606" font-size="12.5" fill="#1f6b43" text-anchor="start" font-weight="400">공통 GND 버스: ESP32 GND · 릴레이 GND 를 한 점으로 묶기 (전위 기준 일치 → 오동작 방지)</text><line x1="40" y1="648" x2="72" y2="648" stroke="#d4453b" stroke-width="4"/><text x="78" y="652" font-size="12" fill="#111827" text-anchor="start" font-weight="400">5V</text><line x1="130" y1="648" x2="162" y2="648" stroke="#4b5563" stroke-width="4"/><text x="168" y="652" font-size="12" fill="#111827" text-anchor="start" font-weight="400">GND</text><line x1="230" y1="648" x2="262" y2="648" stroke="#2f6fb0" stroke-width="4"/><text x="268" y="652" font-size="12" fill="#111827" text-anchor="start" font-weight="400">신호(IOxx)</text><line x1="380" y1="648" x2="412" y2="648" stroke="#1f6b43" stroke-width="4"/><text x="418" y="652" font-size="12" fill="#111827" text-anchor="start" font-weight="400">12V 부하</text><line x1="510" y1="648" x2="542" y2="648" stroke="#b0291f" stroke-width="4"/><text x="548" y="652" font-size="12" fill="#111827" text-anchor="start" font-weight="400">220V 부하</text><line x1="650" y1="636" x2="650" y2="647" stroke="#7c3aed" stroke-width="2.4"/><line x1="638" y1="647" x2="662" y2="647" stroke="#7c3aed" stroke-width="2.8"/><path d="M 641 655 q 9 6 18 0" fill="none" stroke="#7c3aed" stroke-width="2.4"/><line x1="650" y1="658" x2="650" y2="666" stroke="#7c3aed" stroke-width="2.4"/><text x="668" y="656" font-size="11" fill="#7c3aed" text-anchor="start" font-weight="600"></text><text x="670" y="652" font-size="12" fill="#7c3aed" text-anchor="start" font-weight="400">디커플링</text><rect x="40" y="678" width="1340" height="110" rx="10" fill="#fff8e6" stroke="#e0b94a"/><text x="56" y="706" font-size="13" fill="#8a6d1a" text-anchor="start" font-weight="700">안전·안정 체크</text><text x="56" y="730" font-size="12.5" fill="#111827" text-anchor="start" font-weight="400">· 코드 시작 시 전 채널 OFF, A보드 신호 15초 끊기면 히터 자동 OFF.   · 릴레이가 반대로 동작하면 코드 RELAY_LOW_TRIG=false.</text><text x="56" y="752" font-size="12.5" fill="#111827" text-anchor="start" font-weight="400">· 릴레이 VCC에 디커플링 커패시터(10µF/0.1µF) → 코일 ON/OFF 스파이크로 인한 ESP32 리셋/오동작 크게 감소.</text><text x="56" y="774" font-size="12.5" fill="#b0291f" text-anchor="start" font-weight="400">· 220V 배선은 반드시 전원(돼지코) 뽑은 상태에서. 12V·220V 배선 물리적 분리.</text>
</svg>
