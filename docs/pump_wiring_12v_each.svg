<svg width="900" height="500" viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" font-family="'Malgun Gothic','Segoe UI',system-ui,sans-serif">
<title>워터펌프 배선 - 각 펌프 12V 따로</title>
<desc>펌프마다 전용 12V 어댑터를 쓰고, 릴레이 CH1/CH2로 +12V를 ON/OFF. 펌프1=급수, 펌프2=순환.</desc>
<rect x="0" y="0" width="900" height="500" fill="#ffffff"/>

<text x="40" y="34" font-size="19" font-weight="600" fill="#1a1a1a">워터펌프 배선도 — 펌프마다 12V 코드 따로</text>
<text x="40" y="56" font-size="12.5" fill="#6b7280">각 펌프 전용 12V 어댑터 → 릴레이(2PH63003A) CH1·CH2로 ON/OFF · 펌프1=급수, 펌프2=순환</text>

<!-- 범례 -->
<g font-size="11.5">
<line x1="600" y1="30" x2="628" y2="30" stroke="#2e8b57" stroke-width="3"/><text x="634" y="34" fill="#1a1a1a">+12V</text>
<line x1="690" y1="30" x2="718" y2="30" stroke="#6b7280" stroke-width="3"/><text x="724" y="34" fill="#1a1a1a">−(12V 리턴)</text>
</g>

<!-- 릴레이 모듈 -->
<rect x="350" y="150" width="200" height="200" rx="8" fill="#ffffff" stroke="#2f6fb0" stroke-width="2"/>
<text x="450" y="182" font-size="13" font-weight="600" text-anchor="middle" fill="#1a1a1a">릴레이 2PH63003A</text>
<text x="450" y="202" font-size="10.5" text-anchor="middle" fill="#6b7280">CH1 = 펌프1 · CH2 = 펌프2</text>

<!-- 릴레이 우측 접점 -->
<circle cx="550" cy="210" r="4.5" fill="#2e8b57"/><text x="543" y="206" font-size="10" text-anchor="end" fill="#6b7280">CH1 COM</text>
<circle cx="550" cy="235" r="4.5" fill="#2e8b57"/><text x="543" y="231" font-size="10" text-anchor="end" fill="#6b7280">CH1 NO</text>
<circle cx="550" cy="285" r="4.5" fill="#2e8b57"/><text x="543" y="281" font-size="10" text-anchor="end" fill="#6b7280">CH2 COM</text>
<circle cx="550" cy="310" r="4.5" fill="#2e8b57"/><text x="543" y="306" font-size="10" text-anchor="end" fill="#6b7280">CH2 NO</text>

<!-- 12V 어댑터 1 (펌프1 전용) -->
<rect x="40" y="150" width="172" height="54" rx="6" fill="#ffffff" stroke="#d1d5db"/>
<text x="126" y="174" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1a1a1a">12V 어댑터 ①</text>
<text x="126" y="192" font-size="10" text-anchor="middle" fill="#6b7280">펌프1 전용</text>
<circle cx="212" cy="166" r="4.5" fill="#2e8b57"/><text x="204" y="162" font-size="9.5" text-anchor="end" fill="#6b7280">+12V</text>
<circle cx="212" cy="188" r="4.5" fill="#6b7280"/><text x="204" y="192" font-size="9.5" text-anchor="end" fill="#6b7280">−</text>

<!-- 12V 어댑터 2 (펌프2 전용) -->
<rect x="40" y="300" width="172" height="54" rx="6" fill="#ffffff" stroke="#d1d5db"/>
<text x="126" y="324" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1a1a1a">12V 어댑터 ②</text>
<text x="126" y="342" font-size="10" text-anchor="middle" fill="#6b7280">펌프2 전용</text>
<circle cx="212" cy="316" r="4.5" fill="#2e8b57"/><text x="204" y="312" font-size="9.5" text-anchor="end" fill="#6b7280">+12V</text>
<circle cx="212" cy="338" r="4.5" fill="#6b7280"/><text x="204" y="342" font-size="9.5" text-anchor="end" fill="#6b7280">−</text>

<!-- 펌프1 -->
<rect x="690" y="185" width="170" height="56" rx="8" fill="#ffffff" stroke="#d1d5db"/>
<text x="775" y="210" font-size="13" font-weight="600" text-anchor="middle" fill="#1a1a1a">펌프1 (급수)</text>
<text x="775" y="228" font-size="10" text-anchor="middle" fill="#6b7280">SZH-PWAT-040 · 12V</text>
<circle cx="690" cy="203" r="4.5" fill="#2e8b57"/><text x="698" y="199" font-size="9.5" fill="#6b7280">+</text>
<circle cx="690" cy="227" r="4.5" fill="#6b7280"/><text x="698" y="231" font-size="9.5" fill="#6b7280">−</text>

<!-- 펌프2 -->
<rect x="690" y="300" width="170" height="56" rx="8" fill="#ffffff" stroke="#d1d5db"/>
<text x="775" y="325" font-size="13" font-weight="600" text-anchor="middle" fill="#1a1a1a">펌프2 (순환)</text>
<text x="775" y="343" font-size="10" text-anchor="middle" fill="#6b7280">SZH-PWAT-040 · 12V</text>
<circle cx="690" cy="318" r="4.5" fill="#2e8b57"/><text x="698" y="314" font-size="9.5" fill="#6b7280">+</text>
<circle cx="690" cy="342" r="4.5" fill="#6b7280"/><text x="698" y="346" font-size="9.5" fill="#6b7280">−</text>

<!-- ===== 펌프1 회로 (어댑터① ↔ CH1 ↔ 펌프1) ===== -->
<!-- A+ → CH1 COM -->
<polyline points="212,166 232,166 232,130 620,130 620,210 550,210" fill="none" stroke="#2e8b57" stroke-width="2.5"/>
<!-- CH1 NO → 펌프1 + -->
<polyline points="550,235 600,235 600,203 690,203" fill="none" stroke="#2e8b57" stroke-width="2.5"/>
<!-- 펌프1 − → A− -->
<polyline points="690,227 668,227 668,114 226,114 226,188 212,188" fill="none" stroke="#6b7280" stroke-width="2.5"/>

<!-- ===== 펌프2 회로 (어댑터② ↔ CH2 ↔ 펌프2) ===== -->
<!-- B+ → CH2 COM -->
<polyline points="212,316 232,316 232,372 620,372 620,285 550,285" fill="none" stroke="#2e8b57" stroke-width="2.5"/>
<!-- CH2 NO → 펌프2 + -->
<polyline points="550,310 600,310 600,318 690,318" fill="none" stroke="#2e8b57" stroke-width="2.5"/>
<!-- 펌프2 − → B− -->
<polyline points="690,342 668,342 668,396 226,396 226,338 212,338" fill="none" stroke="#6b7280" stroke-width="2.5"/>

<!-- 제어부 안내 -->
<rect x="40" y="420" width="820" height="56" rx="6" fill="#f3f6fb" stroke="#2f6fb0" stroke-dasharray="6 4"/>
<text x="54" y="441" font-size="11.5" fill="#2f6fb0">제어부(기존 배선 그대로): 릴레이 VCC ← ESP32 5V,  GND ← ESP32 GND,  IN1 ← IO25,  IN2 ← IO26</text>
<text x="54" y="461" font-size="11.5" fill="#6b7280">⚠ 펌프 12V 의 − 선은 ESP32 GND와 연결하지 않아도 됩니다 (릴레이 접점이 두 12V 회로를 절연). 어댑터 +/− 극성만 정확히!</text>
</svg>
