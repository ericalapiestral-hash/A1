<svg width="1240" height="760" viewBox="0 0 1240 760" xmlns="http://www.w3.org/2000/svg" font-family="'Malgun Gothic','Segoe UI',system-ui,sans-serif">
<rect x="0" y="0" width="1240" height="760" fill="#ffffff"/><text x="40" y="42" font-size="22" fill="#111827" text-anchor="start" font-weight="700">순환펌프 배선도 — 협신 UP200 (단상 220V · 20W) · 릴레이 직렬 제어</text><text x="40" y="68" font-size="13.5" fill="#6b7280" text-anchor="start" font-weight="400">펌프 전원코드의 활선(L)을 잘라 릴레이 접점(COM–NO) 사이에 직렬 삽입 · 중성선(N)은 자르지 않고 그대로 · 타이머 ON/OFF</text><rect x="40" y="110" width="160" height="180" rx="12" fill="#eef2f7" stroke="#94a3b8" stroke-width="1.6"/><text x="120" y="140" font-size="16" fill="#111827" text-anchor="middle" font-weight="700">ESP32</text><text x="120" y="160" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="400">(보드)</text><text x="184" y="164" font-size="13" fill="#111827" text-anchor="end" font-weight="400">5V</text><circle cx="200" cy="160" r="5" fill="#d4453b"/><text x="184" y="204" font-size="13" fill="#111827" text-anchor="end" font-weight="400">GND</text><circle cx="200" cy="200" r="5" fill="#4b5563"/><text x="184" y="244" font-size="13" fill="#111827" text-anchor="end" font-weight="400">IO26</text><circle cx="200" cy="240" r="5" fill="#2f6fb0"/><rect x="300" y="110" width="240" height="180" rx="12" fill="#f9fafb" stroke="#cbd5e1" stroke-width="1.6"/><text x="420" y="138" font-size="15" fill="#111827" text-anchor="middle" font-weight="700">릴레이 모듈 CH2 (순환)</text><text x="420" y="157" font-size="11.5" fill="#b0291f" text-anchor="middle" font-weight="600">LOW = ON · 250VAC 정격</text><circle cx="300" cy="160" r="5" fill="#d4453b"/><text x="314" y="164" font-size="13" fill="#111827" text-anchor="start" font-weight="400">VCC</text><circle cx="300" cy="200" r="5" fill="#4b5563"/><text x="314" y="204" font-size="13" fill="#111827" text-anchor="start" font-weight="400">GND</text><circle cx="300" cy="240" r="5" fill="#2f6fb0"/><text x="314" y="244" font-size="13" fill="#111827" text-anchor="start" font-weight="400">IN</text><polyline points="200,160 300,160" fill="none" stroke="#d4453b" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/><polyline points="200,200 300,200" fill="none" stroke="#4b5563" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/><polyline points="200,240 300,240" fill="none" stroke="#2f6fb0" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/><line x1="258" y1="160" x2="258" y2="171" stroke="#7c3aed" stroke-width="2.4"/><line x1="246" y1="171" x2="270" y2="171" stroke="#7c3aed" stroke-width="2.8"/><path d="M 249 179 q 9 6 18 0" fill="none" stroke="#7c3aed" stroke-width="2.4"/><line x1="258" y1="182" x2="258" y2="190" stroke="#7c3aed" stroke-width="2.4"/><text x="276" y="180" font-size="11" fill="#7c3aed" text-anchor="start" font-weight="600">10µF</text><polyline points="258,160 300,160" fill="none" stroke="#d4453b" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><polyline points="258,190 258,200 300,200" fill="none" stroke="#4b5563" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><text x="364" y="278" font-size="12" fill="#b0291f" text-anchor="middle" font-weight="600">COM</text><text x="476" y="278" font-size="12" fill="#b0291f" text-anchor="middle" font-weight="600">NO</text><circle cx="364" cy="290" r="5" fill="#b0291f"/><circle cx="476" cy="290" r="5" fill="#b0291f"/><rect x="600" y="110" width="600" height="150" rx="10" fill="#eef7f0" stroke="#79b894"/><text x="620" y="138" font-size="13.5" fill="#1f6b43" text-anchor="start" font-weight="700">순환 타이머 (코드: UP200_pump.ino)</text><text x="620" y="162" font-size="12.5" fill="#111827" text-anchor="start" font-weight="400">· 기본 주기: ON 5분 → OFF 25분 무한 반복</text><text x="620" y="184" font-size="12.5" fill="#111827" text-anchor="start" font-weight="400">· 시리얼(115200): on=10 / off=20 으로 분 단위 변경</text><text x="620" y="206" font-size="12.5" fill="#111827" text-anchor="start" font-weight="400">· 1=강제ON · 0=강제OFF · a=자동 · t=극성반전 · s=상태</text><text x="620" y="230" font-size="12.5" fill="#6b7280" text-anchor="start" font-weight="400">· 릴레이 ON = 접점(COM–NO) 붙음 = 펌프 ON</text><text x="620" y="250" font-size="12.5" fill="#b0291f" text-anchor="start" font-weight="400">· 릴레이는 활선 L 만 끊음(N은 항상 통전)</text><rect x="40" y="380" width="170" height="120" rx="10" fill="#fff5f4" stroke="#b0291f" stroke-width="1.5"/><text x="125" y="410" font-size="14" fill="#b0291f" text-anchor="middle" font-weight="700">⚠ 220V 콘센트</text><text x="125" y="430" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">(돼지코)</text><circle cx="210" cy="458" r="5" fill="#b0291f"/><text x="198" y="462" font-size="12" fill="#b0291f" text-anchor="end" font-weight="700">L</text><circle cx="210" cy="484" r="5" fill="#0e7490"/><text x="198" y="488" font-size="12" fill="#0e7490" text-anchor="end" font-weight="700">N</text><rect x="980" y="380" width="215" height="150" rx="12" fill="#fff" stroke="#0f4c81" stroke-width="1.8"/><text x="1087.5" y="414" font-size="16" fill="#0f4c81" text-anchor="middle" font-weight="700">협신 UP200</text><text x="1087.5" y="436" font-size="12.5" fill="#6b7280" text-anchor="middle" font-weight="400">단상 220V · 20W</text><text x="1087.5" y="456" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="400">수중모터 (순환)</text><circle cx="980" cy="478" r="5" fill="#b0291f"/><text x="994" y="482" font-size="12" fill="#b0291f" text-anchor="start" font-weight="700">L</text><circle cx="980" cy="504" r="5" fill="#0e7490"/><text x="994" y="508" font-size="12" fill="#0e7490" text-anchor="start" font-weight="700">N</text><polyline points="210,458 364,458 364,290" fill="none" stroke="#b0291f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><polyline points="476,290 476,478 980,478" fill="none" stroke="#b0291f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><line x1="258" y1="446" x2="282" y2="470" stroke="#b0291f" stroke-width="2.8"/><line x1="258" y1="470" x2="282" y2="446" stroke="#b0291f" stroke-width="2.8"/><text x="270" y="440" font-size="11" fill="#b0291f" text-anchor="middle" font-weight="600">여기서 절단</text><text x="514" y="448" font-size="11.5" fill="#b0291f" text-anchor="middle" font-weight="600">활선 L = 잘라서 릴레이 접점에 직렬</text><polyline points="210,484 980,504" fill="none" stroke="#0e7490" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="595" y="522" font-size="11.5" fill="#0e7490" text-anchor="middle" font-weight="400">중성선 N — 자르지 않고 그대로 (OFF 때도 통전)</text><line x1="40" y1="606" x2="72" y2="606" stroke="#b0291f" stroke-width="4"/><text x="78" y="610" font-size="12" fill="#111827" text-anchor="start" font-weight="400">활선 L (220V)</text><line x1="210" y1="606" x2="242" y2="606" stroke="#0e7490" stroke-width="4"/><text x="248" y="610" font-size="12" fill="#111827" text-anchor="start" font-weight="400">중성선 N</text><line x1="360" y1="606" x2="392" y2="606" stroke="#d4453b" stroke-width="4"/><text x="398" y="610" font-size="12" fill="#111827" text-anchor="start" font-weight="400">5V</text><line x1="450" y1="606" x2="482" y2="606" stroke="#4b5563" stroke-width="4"/><text x="488" y="610" font-size="12" fill="#111827" text-anchor="start" font-weight="400">GND</text><line x1="560" y1="606" x2="592" y2="606" stroke="#2f6fb0" stroke-width="4"/><text x="598" y="610" font-size="12" fill="#111827" text-anchor="start" font-weight="400">신호 IO26</text><line x1="700" y1="595" x2="722" y2="617" stroke="#b0291f" stroke-width="2.6"/><line x1="700" y1="617" x2="722" y2="595" stroke="#b0291f" stroke-width="2.6"/><text x="730" y="610" font-size="12" fill="#b0291f" text-anchor="start" font-weight="400">코드 절단 지점</text><rect x="40" y="640" width="1160" height="100" rx="10" fill="#fff8e6" stroke="#e0b94a"/><text x="58" y="668" font-size="13" fill="#8a6d1a" text-anchor="start" font-weight="700">안전 (220V)</text><text x="58" y="692" font-size="12" fill="#b0291f" text-anchor="start" font-weight="400">· 반드시 콘센트(돼지코) 뽑은 상태에서 코드 절단·결선. 절단부는 열수축/절연테이프로 절연 필수.</text><text x="58" y="712" font-size="12" fill="#111827" text-anchor="start" font-weight="400">· 릴레이는 활선 L 만 끊음 → OFF여도 N은 통전. 펌프 손댈 땐 콘센트째 분리.</text><text x="58" y="732" font-size="12" fill="#111827" text-anchor="start" font-weight="400">· 릴레이 접점 250VAC 이상 정격 확인(UP200은 20W라 여유 충분). 누전차단 콘센트 권장.</text>
</svg>
