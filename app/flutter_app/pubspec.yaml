name: aqua_control
description: ESP32 수조 모니터링/제어 앱
publish_to: 'none'
# 릴리스할 때 이 값을 올리고, GitHub 릴리스 태그를 v<버전> 으로 맞추세요 (예: v1.1.0)
version: 1.3.0+4

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  flutter_blue_plus: ^1.32.12
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  # C 시안(웜 네오모피즘) 폰트 — 오프라인(BLE 전용) 사용을 위해 번들 (OFL 라이선스)
  fonts:
    - family: Jua
      fonts:
        - asset: assets/fonts/Jua-Regular.ttf
    - family: GowunDodum
      fonts:
        - asset: assets/fonts/GowunDodum-Regular.ttf
